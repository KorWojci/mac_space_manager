name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-26'
        with:
          name: Space-Manager-app
          path: build/Space-Manager.zip
